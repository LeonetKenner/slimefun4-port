name: End to End Testing

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Slimefun artifact name'
        required: true
        type: string

jobs:
  e2e-testing:
    name: End to End Testing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        include:
          - mcVersion: '1.16.5'
            javaVersion: '16'
          - mcVersion: '1.17.1'
            javaVersion: '17'
          - mcVersion: '1.18.2'
            javaVersion: '18'
          - mcVersion: '1.19.4'
            javaVersion: '19'
          - mcVersion: '1.20.4'
            javaVersion: '20'
          - mcVersion: '1.20.6'
            javaVersion: '21'
          - mcVersion: '1.21.11'
            javaVersion: '21'
          - mcVersion: '26.3'
            javaVersion: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.javaVersion }}
          java-package: jdk
          architecture: x64

      - name: Setup server
        run: |
          echo 'eula=true' > eula.txt
          mkdir plugins

      - name: Download ${{ matrix.mcVersion }} Paper
        run: |
          VERSION="${{ matrix.mcVersion }}"

          URL=$(curl -s "https://fill.papermc.io/v3/projects/paper/versions/$VERSION/builds/latest" \
            | jq -r '.downloads["server:default"].url')

          echo "Downloading... $URL"
          curl -o paper.jar "$URL"

      - name: Download Slimefun
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: plugins/

      - name: Download e2e-tester
        run: |
          curl -o e2e-tester.jar https://preview-builds.walshy.dev/download/e2e-tester/main/latest
          mv e2e-tester.jar plugins/e2e-tester.jar

      - name: Run server
        run: |
          java -jar paper.jar --nogui
